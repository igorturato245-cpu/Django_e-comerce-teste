{% extends 'global/base.html' %}
{% load static %}
{% block content %}
  <!-- ============================== -->
  <!-- SEÇÃO PRODUTO -->
  <!-- ============================== -->
  <section class="produto-section">
    <div class="produto-card">
      <!-- FOTO -->
      <div class="produto-foto-box">
        <img class="produto-foto" alt="{{ produto.name }}" />
      </div>

      <!-- INFO PRINCIPAL -->
      <div class="produto-info">
        <div class="produto-nome-box card-box">
          <h1 class="produto-nome">{{ produto.name }}</h1>
        </div>

        <div class="produto-descricao-box card-box">
          <p class="produto-descricao">{{ produto.descricao }}</p>
        </div>

        <div class="produto-preco-box card-box">
          <span class="produto-preco">R$ {{ produto.preco }}</span>
        </div>

        <!-- QUANTIDADE -->
        <div class="produto-quantidade-box card-box">
          <span>Quantidade</span>

          <div class="quantidade-controle">
            <button type="button" class="quantidade-btn" data-acao="menos">-</button>
            <span class="quantidade-num">1</span>
            <button type="button" class="quantidade-btn" data-acao="mais">+</button>
          </div>

          <!-- quantidade real enviada -->
          <input type="hidden" id="quantidade-input" value="1" />
        </div>

        <div class="produto-comprar-box card-box">
          <form method="post" action="{% url 'carrinho:adicionar' produto.id %}">
            {% csrf_token %}
            <input type="hidden" name="quantidade" id="quantidade-input" value="1">
            <input type="hidden" name="acao" value="comprar" />
            <button type="submit" class="botao-comprar">Comprar</button>
          </form>
        </div>

        <div class="produto-comprar-box card-box">
          <form method="post" action="{% url 'carrinho:adicionar' produto.id %}">
            {% csrf_token %}
            <input type="hidden" name="quantidade" id="quantidade-input" value="1">
            <input type="hidden" name="acao" value="continuar" />
            <button type="submit" class="botao-comprar">Adicionar ao carrinho</button>
          </form>
        </div>
      </div>

      <span class="produto-aviso">Produto não é entregue pela nossa loja.</span>
    </div>
  </section>
{% endblock %}
