<!DOCTYPE html>
<html lang="en">

<head>
    {% include "global/partials/_head.html" %}
</head>

<body>
    {% include "global/partials/_header.html"%}
    {%include "global/partials/_propaganda.html"%}
    <main>
        {% block content %}{% endblock content %}
        {% include "global/partials/_footer.html"%}
    </main>


    <script>
        let lastScroll = 0;
        const header = document.querySelector('.header');

        window.addEventListener('scroll', () => {
            const current = window.pageYOffset;

            if (current > lastScroll && current > 80) {
                // Descendo → esconder header
                header.classList.add('hide');
            } else {
                // Subindo → mostrar header
                header.classList.remove('hide');
            }

            lastScroll = current;
        });
    </script>


    <script>
        // =========================
        // CARROSSEL PERFUMES
        // =========================
        const carrosselPerf = document.getElementById("carrosselPerfumes");
        const setaPrevPerf = document.getElementById("btnPrev");
        const setaNextPerf = document.getElementById("btnNext");

        // calcula o tamanho de um card para rolagem precisa
        function getScrollAmountPerf() {
            const item = carrosselPerf.querySelector(".perfume-item");
            return item ? item.offsetWidth + 22 : 300; // 22 = gap entre os cards
        }

        // botão → direita
        setaNextPerf.addEventListener("click", () => {
            carrosselPerf.scrollBy({
                left: getScrollAmountPerf(),
                behavior: "smooth"
            });
            updateSetasPerf();
        });

        // botão ← esquerda
        setaPrevPerf.addEventListener("click", () => {
            carrosselPerf.scrollBy({
                left: -getScrollAmountPerf(),
                behavior: "smooth"
            });
            updateSetasPerf();
        });

        // controla quando mostrar/esconder as setas
        function updateSetasPerf() {
            const maxScroll = carrosselPerf.scrollWidth - carrosselPerf.clientWidth;

            if (carrosselPerf.scrollLeft <= 5) {
                setaPrevPerf.classList.add("hidden");
            } else {
                setaPrevPerf.classList.remove("hidden");
            }

            if (carrosselPerf.scrollLeft >= maxScroll - 5) {
                setaNextPerf.classList.add("hidden");
            } else {
                setaNextPerf.classList.remove("hidden");
            }
        }

        // atualiza setas ao rolar manualmente
        carrosselPerf.addEventListener("scroll", updateSetasPerf);

        // inicia corretamente
        updateSetasPerf();

    </script>
