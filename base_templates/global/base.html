    <script>
        let lastScroll = 0;
        const header = document.querySelector('.header');

        window.addEventListener('scroll', () => {
            const current = window.pageYOffset;

            if (current > lastScroll && current > 80) {
                // Descendo → esconder header
                header.classList.add('hide');
            } else {
                // Subindo → mostrar header
                header.classList.remove('hide');
            }

            lastScroll = current;
        });
    </script>

    <script>
        // =========================
        // CARROSSEL OFERTAS DO DIA
        // =========================
        const carrosselOferta = document.getElementById("carrosselOfertas");
        const setaPrevOferta = document.getElementById("btnoferta");
        const setaNextOferta = document.getElementById("btnnextoferta");

        // calcula o tamanho de um card para rolagem precisa
        function getScrollAmountOferta() {
            const item = carrosselOferta.querySelector(".oferta-card");
            return item ? item.offsetWidth + 22 : 300; // 22 = gap entre os cards
        }

        // botão → direita
        setaNextOferta.addEventListener("click", () => {
            carrosselOferta.scrollBy({
                left: getScrollAmountOferta(),
                behavior: "smooth"
            });
            updateSetasOferta();
        });

        // botão ← esquerda
        setaPrevOferta.addEventListener("click", () => {
            carrosselOferta.scrollBy({
                left: -getScrollAmountOferta(),
                behavior: "smooth"
            });
            updateSetasOferta();
        });

        // controla quando mostrar/esconder as setas
        function updateSetasOferta() {
            const maxScroll = carrosselOferta.scrollWidth - carrosselOferta.clientWidth;

            if (carrosselOferta.scrollLeft <= 5) {
                setaPrevOferta.classList.add("hidden");
            } else {
                setaPrevOferta.classList.remove("hidden");
            }

            if (carrosselOferta.scrollLeft >= maxScroll - 5) {
                setaNextOferta.classList.add("hidden");
            } else {
                setaNextOferta.classList.remove("hidden");
            }
        }

        // atualiza setas ao rolar manualmente
        carrosselOferta.addEventListener("scroll", updateSetasOferta);

        // inicia corretamente
        updateSetasOferta();
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const numEl = document.querySelector(".quantidade-num");
            const inputQtds = document.querySelectorAll("#quantidade-input");
            const btns = document.querySelectorAll(".quantidade-btn");

            let quantidade = 1;

            btns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const acao = btn.dataset.acao;

                    if (acao === "mais" && quantidade < 99) quantidade++;
                    if (acao === "menos" && quantidade > 1) quantidade--;

                    numEl.textContent = quantidade;

                    inputQtds.forEach(input => {
                        input.value = quantidade;
                    });
                });
            });

        });
    </script>




    <script>
        document.addEventListener("DOMContentLoaded", function () {

            document.querySelectorAll(".qtd-controle").forEach(controle => {

                const btns = controle.querySelectorAll(".qtd-btn");
                const numEl = controle.querySelector(".qtd-num");
                const itemId = controle.dataset.itemId;

                btns.forEach(btn => {
                    btn.addEventListener("click", () => {

                        let quantidade = parseInt(numEl.textContent);
                        const tipo = btn.textContent.trim();

                        if (tipo === "+" && quantidade < 99) quantidade++;
                        if (tipo === "-" && quantidade > 1) quantidade--;

                        fetch("{% url 'carrinho:atualizar_quantidade' %}", {
                            method: "POST",
                            headers: {
                                "X-CSRFToken": "{{ csrf_token }}",
                                "Content-Type": "application/x-www-form-urlencoded"
                            },
                            body: `item_id=${itemId}&quantidade=${quantidade}`
                        })
                            .then(res => res.json())
                            .then(data => {
                                numEl.textContent = data.quantidade;
                                document.querySelectorAll(".resumo-total, .resumo-subtotal")
                                    .forEach(el => el.textContent = `R$ ${data.subtotal}`);
                            });
                    });
                });
            });

        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            document.querySelectorAll(".btn-remover").forEach(btn => {

                btn.addEventListener("click", function () {
                    const itemId = btn.dataset.itemId;
                    const linha = btn.closest(".carrinho-item");

                    fetch(`/carrinho/remover/${itemId}/`, {
                        method: "POST",
                        headers: {
                            "X-CSRFToken": "{{ csrf_token }}",
                        }
                    })
                        .then(res => res.json())
                        .then(data => {

                            if (data.success) {
                                linha.remove();

                                // Atualiza subtotal e total
                                document.querySelectorAll(".resumo-subtotal, .resumo-total")
                                    .forEach(el => el.textContent = `R$ ${data.subtotal}`);

                                // Se não sobrar itens → recarrega para mostrar carrinho vazio
                                if (data.itens_restantes === 0) {
                                    location.reload();
                                }
                            }
                        });
                });

            });

        });
    </script>
