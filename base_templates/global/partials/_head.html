{% load static %}
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>{% block title %}Luvie Home{% endblock title %}</title>
<meta name="description" content="{% block meta_description %}As melhores ofertas para produtos voltados ao domicílio.{% endblock %}">
<link rel="canonical" href="{{ request.build_absolute_uri }}">


<meta property="og:type" content="website">
<meta property="og:title" content="{% block og_title %}Luvie Home - E-commerce{% endblock %}">
<meta property="og:description" content="{% block og_description %}Confira nossos produtos exclusivos com os melhores preços.{% endblock %}">
<meta property="og:image" content="{% block og_image %}{% static 'global/img/OIP.jpeg' %}{% endblock %}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">


<link rel="stylesheet" href="{% static 'global/css/style.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<!-- Se estiver em produção, carrega os scripts de rastreio -->
{% if not debug %}
    <!-- Exemplo: Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXX');
    </script>
{% endif %}
